<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t">
  <title id="t">Abstract data flow: streams of connected nodes moving across a dark blue field</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f4d"/>
      <stop offset=".55" stop-color="#06158f"/>
      <stop offset="1" stop-color="#2433ff"/>
    </linearGradient>
    <radialGradient id="glow" cx=".72" cy=".42" r=".55">
      <stop offset="0" stop-color="#8c9bff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#8c9bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity=".09"/>
    </pattern>
    <linearGradient id="stream" x1="0" x2="1">
      <stop offset="0" stop-color="#8c9bff" stop-opacity="0"/>
      <stop offset=".35" stop-color="#8c9bff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#e6e9ff" stop-opacity=".9"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Flow streams -->
  <g fill="none" stroke="url(#stream)" stroke-linecap="round">
    <path d="M -40 640 C 320 600, 520 420, 820 440 S 1260 300, 1660 220" stroke-width="3"/>
    <path d="M -40 700 C 360 680, 560 520, 860 520 S 1280 420, 1660 380" stroke-width="2" stroke-opacity=".7"/>
    <path d="M -40 560 C 280 520, 500 330, 780 340 S 1220 190, 1660 110" stroke-width="2" stroke-opacity=".55"/>
    <path d="M -40 780 C 400 770, 640 620, 920 610 S 1320 540, 1660 530" stroke-width="1.5" stroke-opacity=".45"/>
  </g>

  <!-- Network of nodes along the streams -->
  <g stroke="#b8c2ff" stroke-opacity=".35" stroke-width="1.5">
    <line x1="820" y1="440" x2="860" y2="520"/>
    <line x1="1040" y1="370" x2="1080" y2="468"/>
    <line x1="1260" y1="300" x2="1300" y2="410"/>
    <line x1="1040" y1="370" x2="1000" y2="260"/>
    <line x1="1260" y1="300" x2="1230" y2="200"/>
    <line x1="1080" y1="468" x2="1120" y2="585"/>
    <line x1="1460" y1="258" x2="1480" y2="370"/>
  </g>
  <g fill="#e6e9ff">
    <circle cx="820" cy="440" r="7"/>
    <circle cx="1040" cy="370" r="9"/>
    <circle cx="1260" cy="300" r="7"/>
    <circle cx="1460" cy="258" r="6"/>
    <circle cx="860" cy="520" r="5" fill-opacity=".8"/>
    <circle cx="1080" cy="468" r="6" fill-opacity=".8"/>
    <circle cx="1300" cy="410" r="5" fill-opacity=".8"/>
    <circle cx="1480" cy="370" r="4" fill-opacity=".8"/>
    <circle cx="1000" cy="260" r="4" fill-opacity=".6"/>
    <circle cx="1230" cy="200" r="4" fill-opacity=".6"/>
    <circle cx="1120" cy="585" r="4" fill-opacity=".6"/>
  </g>
  <!-- Highlighted nodes (checked states) -->
  <g fill="none" stroke="#ffffff" stroke-width="2">
    <circle cx="1040" cy="370" r="18" stroke-opacity=".6"/>
    <circle cx="1260" cy="300" r="15" stroke-opacity=".4"/>
  </g>
  <!-- Data packets travelling along streams -->
  <g fill="#ffffff">
    <rect x="600" y="455" width="18" height="6" rx="3" transform="rotate(-18 609 458)" fill-opacity=".9"/>
    <rect x="1150" y="325" width="14" height="5" rx="2.5" transform="rotate(-14 1157 327)" fill-opacity=".8"/>
    <rect x="700" y="555" width="12" height="5" rx="2.5" transform="rotate(-12 706 557)" fill-opacity=".6"/>
    <rect x="1370" y="395" width="12" height="5" rx="2.5" transform="rotate(-8 1376 397)" fill-opacity=".6"/>
  </g>
</svg>
